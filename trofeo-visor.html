<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trofeo · Mundial del Plato Típico 2026</title><script type="module" src="assets/model-viewer.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:system-ui;color:#fff}model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}.controls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px}button{border:1px solid #d5b36c80;border-radius:18px;background:#101927df;color:#fff;padding:7px 12px;cursor:pointer;font:12px system-ui}button:focus-visible{outline:2px solid #f4cf70;outline-offset:3px}#status{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:#dfbd76}#status[hidden]{display:none}body{display:grid;grid-template-rows:minmax(0,1fr) 44px;gap:4px;padding:8px 0 0}model-viewer{min-height:0;grid-row:1}.controls{position:static;grid-row:2;align-items:center;padding-bottom:4px}button{padding:6px 9px;font-size:11px}</style></head><body><model-viewer id="cup" src="assets/trofeo-2026.glb" alt="Trofeo dorado del Mundial del Plato Típico en Suiza 2026, con plato y dos figuras" camera-controls auto-rotate rotation-per-second="20deg" auto-rotate-delay="1500" camera-orbit="0deg 85deg 110%" field-of-view="32deg" exposure="0.85" shadow-intensity="0" interaction-prompt="none" touch-action="pan-y"></model-viewer><div id="status" role="status">Cargando trofeo 3D…</div><div class="controls"><button id="pause" type="button" aria-pressed="false">Pausar giro</button><button id="front" type="button">Ver frente</button></div><script>
const cup=document.getElementById('cup'),pause=document.getElementById('pause'),status=document.getElementById('status');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,parentPlaying=true;function sync(){cup.autoRotate=playing&&parentPlaying&&!document.hidden;pause.textContent=playing?'Pausar giro':'Activar giro';pause.setAttribute('aria-pressed',String(!playing))}pause.onclick=()=>{playing=!playing;sync()};document.getElementById('front').onclick=()=>{playing=false;cup.resetTurntableRotation();cup.cameraOrbit='0deg 85deg 110%';sync()};cup.addEventListener('load',()=>{status.hidden=true;sync()});cup.addEventListener('error',()=>{status.textContent='No se pudo cargar el trofeo. Comprueba la carpeta assets.'});document.addEventListener('visibilitychange',sync);window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='trofeo-visibility'){parentPlaying=!!e.data.play;sync()}});customElements.whenDefined('model-viewer').then(sync);
</script></body></html>
